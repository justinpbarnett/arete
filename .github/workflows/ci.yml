name: Arete CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arete-check/**']

permissions:
  contents: read

concurrency:
  group: arete-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: arete-checks
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select check candidate
        if: startsWith(github.ref, 'refs/heads/arete-check/')
        run: git checkout --detach "$GITHUB_SHA^2"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.2'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --locked
      - name: Existing behavior checks
        run: uv run --locked python -m tests.parallel --timeout 30
      - name: Observe the worker isolation check
        if: startsWith(github.ref, 'refs/heads/arete-check/')
        run: |
          uv run --locked python - <<'PYTHON'
          import unittest
          name = "tests.test_behavior.AuthorityPrivatePiWorkerTests.test_private_worker_launch_denies_the_configured_file_store"
          suite = unittest.defaultTestLoader.loadTestsFromName(name)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not (result.wasSuccessful() and result.testsRun == 1 and not result.skipped and not result.expectedFailures))
          PYTHON
      - name: Python lint, compilation and imports
        run: |
          sh tools/lint-arete
          uv run --locked python -m compileall -q arete
          uv run --locked python -c "import importlib, pathlib; [importlib.import_module('arete.' + p.stem) for p in sorted(pathlib.Path('arete').glob('*.py'))]"
      - name: JavaScript syntax
        run: |
          for script in arete/web/*.js; do
            node --check "$script" || exit 1
          done

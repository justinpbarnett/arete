[project]
name = "arete"
version = "0.1.0"
description = "Agent loops that keep running and improve the harness they run in"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arete = "arete.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.2"

[tool.uv.build-backend]
module-name = "arete"
module-root = ""

[tool.ruff.lint]
ignore = ["BLE001"]

[project]
name = "arete"
version = "0.1.0"
description = "Agent loops that keep running and improve the harness they run in"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arete = "arete_launcher:main"

[build-system]
requires = []
build-backend = "arete_build"
backend-path = ["tools"]

[tool.uv]
required-version = ">=0.10.2"

[tool.uv.build-backend]
module-root = ""
source-include = ["tools/arete_build.py", "tools/launcher/arete_launcher/__init__.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001"]

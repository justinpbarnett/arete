<!-- Round 4, final: the round 3 base with C's Floor (lines table, chart in the detail) and A's Blueprint canvas, refined to Justin's round 3 picks. Prototype, throw away. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arete Round 3 Base</title>
<link rel="stylesheet" href="tokens.css">
<script src="switcher.js"></script>
<script src="manifest.js"></script>
<script src="mock.js"></script>
<style>
:root { --side: 216px; --scrim: color-mix(in srgb, var(--canvas) 60%, transparent); }
html, body { height: 100%; overflow: hidden; }
body { line-height: 1.4; }
::selection { background: var(--selected); color: var(--ink); }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding-left: 18px; }
code { font-family: var(--font-data); font-size: 12px; background: var(--raised); padding: 0 3px; }

.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: calc(100vh - 64px); border-bottom: var(--frame); }
.mono { font-family: var(--font-data); font-variant-numeric: var(--numbers); }
.lbl { font-family: var(--font-data); font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--label-tracking); color: var(--muted); font-weight: var(--weight-medium); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.ink2 { color: var(--ink-2); }
.strong { font-weight: var(--weight-strong); }
.sp { flex: 1; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.link { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 2px; }
.link:hover { text-decoration-color: var(--ink); }

.side { background: var(--panel); border-right: var(--frame); display: flex; flex-direction: column; min-height: 0; }
.side-top { display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px; border-bottom: var(--frame); }
.ws { font-family: var(--font-data); font-weight: var(--weight-strong); letter-spacing: .02em; }
.ws-mark { width: 18px; height: 18px; border: 1px solid var(--ink-2); display: inline-flex; align-items: center; justify-content: center; font: 11px var(--font-data); }
.side-search { margin: 8px 8px 4px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid var(--rule); background: var(--canvas); color: var(--muted); font-size: var(--text-s); cursor: pointer; border-radius: var(--radius-control); }
.side-nav { flex: 1; overflow: auto; padding: 4px 8px 8px; }
.side-grp { padding: 12px 6px 4px; }
.nav { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px; color: var(--ink-2); border-radius: var(--radius-control); }
.nav:hover { background: var(--raised); }
.nav.sel { background: var(--selected); color: var(--ink); }
.nav .ng { width: 14px; text-align: center; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.nav .nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nc { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); font-variant-numeric: var(--numbers); }
.nav.sub { height: 24px; font-size: var(--text-s); }
.nav .nc.fault { color: var(--fault); }
.side-foot { border-top: var(--frame); padding: 8px 12px; font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); line-height: 1.6; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 40px; flex: none; display: flex; align-items: center; gap: var(--space-4); padding: 0 12px 0 16px; border-bottom: var(--frame); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: var(--text-s); white-space: nowrap; overflow: hidden; }
.crumbs a:hover { color: var(--ink); }
.crumbs .cur { color: var(--ink); }
.crumbs .sep { color: var(--faint); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); flex: none; }
.top-r .mono { font-size: var(--text-s); }
.zone { font-family: var(--font-data); font-size: var(--text-s); font-weight: var(--weight-strong); letter-spacing: var(--label-tracking); }
.andon { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; background: var(--accent); color: var(--on-accent); font-family: var(--font-data); font-size: var(--text-s); font-weight: var(--weight-strong); letter-spacing: .04em; border-radius: var(--radius-control); }
.andon .hi { font-weight: var(--weight-regular); }
.lstrip { display: inline-flex; gap: 2px; align-items: center; }
.lstrip a { width: 11px; height: 18px; border: 1px solid var(--rule-strong); display: inline-block; }
.lstrip a.idle { border-color: var(--faint); border-style: dashed; }
.lstrip a.run { background: var(--raised); }
.lstrip a.ny { background: var(--accent); border-color: var(--accent); }
.lstrip a.fault { background: var(--fault); border-color: var(--fault); }
.lstrip a.cur { outline: 1px solid var(--ink); outline-offset: 1px; }
.side-foot a:hover { color: var(--ink); }

.head { flex: none; border-bottom: var(--frame); padding: 10px 16px 0; }
.hrow { display: flex; align-items: center; gap: var(--space-4); min-height: 28px; }
.hrow h1 { font-size: var(--text-l); font-weight: var(--weight-strong); }
.hrow .sub { color: var(--muted); font-size: var(--text-s); font-family: var(--font-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; margin-left: var(--space-4); flex-wrap: wrap; }
.tab { height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-s); color: var(--muted); border: 1px solid transparent; border-radius: var(--radius-control); white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--raised); }
.tab.sel { color: var(--ink); border-color: var(--rule-strong); background: var(--raised); }
.tools { display: flex; align-items: center; gap: 6px; padding: 8px 0; flex-wrap: wrap; position: relative; }

.fchip { height: 22px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); font-size: var(--text-s); border-radius: var(--radius-control); cursor: pointer; white-space: nowrap; }
.fchip .x { color: var(--faint); font-family: var(--font-data); }
.fchip.on { border-color: var(--rule-strong); background: var(--selected); color: var(--ink); }
.fchip.add { border-style: solid; color: var(--muted); background: transparent; }
.fchip b { font-weight: var(--weight-medium); font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius-control); overflow: hidden; }
.seg button { height: 22px; padding: 0 8px; background: var(--panel); border: 0; border-right: 1px solid var(--rule); color: var(--muted); font-size: var(--text-s); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--selected); color: var(--ink); }

.btn { height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--rule-strong); border-radius: var(--radius-control); color: var(--ink); font-size: var(--text-s); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--selected); }
.btn.primary { border-bottom: var(--act-line); }
.btn.ghost { background: transparent; border-color: var(--rule); color: var(--muted); }
.btn[disabled] { color: var(--faint); cursor: not-allowed; border-color: var(--rule); }
.k { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border: 1px solid var(--rule-strong); border-radius: var(--radius-control); background: var(--canvas); color: var(--ink-2); font: 10px/1 var(--font-data); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.pane.focus { outline: 1px solid var(--rule-strong); outline-offset: -1px; }
.side.focus { outline: 1px solid var(--rule-strong); outline-offset: -1px; }
.cur-item { box-shadow: inset 2px 0 0 var(--ink-2); background: var(--panel); }
.nav.cur-item { box-shadow: inset 2px 0 0 var(--ink-2); }
.nav .nk { width: 18px; flex: none; text-align: center; font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); border: 1px solid transparent; }
.nav:not(.sub) .nk:not(:empty) { border-color: var(--rule); }
.nav.sel .nk { color: var(--ink); border-color: var(--rule-strong); }
.nav.sub { padding-left: 6px; }
.nav.sub .nk { border: 0; }

.body { flex: 1; min-height: 0; display: grid; }
.pane { overflow: auto; min-height: 0; min-width: 0; }
.pane.left { border-right: var(--frame); background: var(--canvas); }
.pane.detail { background: var(--canvas); }
.pane.props { border-left: var(--frame); background: var(--panel); }

.keys { flex: none; height: 28px; display: flex; align-items: center; gap: var(--space-4); padding: 0 12px 0 0; border-top: var(--frame); background: var(--panel); font-size: var(--text-s); color: var(--muted); overflow: hidden; white-space: nowrap; }
.keys span { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.keys .kl { display: flex; align-items: center; gap: var(--space-4); min-width: 0; overflow: hidden; flex: 1; }
.mode { height: 100%; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-family: var(--font-data); font-size: var(--text-micro); letter-spacing: var(--label-tracking); font-weight: var(--weight-strong); color: var(--ink); border-right: 1px solid var(--rule-strong); flex: none; }
.mode.ins { background: var(--ink-2); color: var(--canvas); border-right-color: var(--ink-2); }
.pend { font-family: var(--font-data); color: var(--ink); flex: none; }
.ntc { margin-left: auto; flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-size: var(--text-s); padding-left: 12px; border-left: 1px solid var(--rule); }
.ntc .g { font-family: var(--font-data); color: var(--muted); margin-right: 6px; }

.grp { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; background: var(--panel); border-bottom: var(--frame); border-top: var(--frame); margin-top: -1px; }
.grp .lbl { color: var(--ink-2); }
.grp .n { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; min-height: var(--row); padding: 3px 12px; cursor: pointer; border-bottom: 1px solid var(--canvas); }
.row:hover { background: var(--panel); }
.row.sel { background: var(--selected); }
.row .id { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); flex: none; }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: var(--numbers); }
.row.two { align-items: flex-start; flex-direction: column; gap: 2px; padding: 6px 12px; }
.row.two .r1, .row.two .r2 { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
.row.two .r2 { font-size: var(--text-s); color: var(--muted); white-space: nowrap; overflow: hidden; }
.row.two .r2 > * { flex: none; }
.row.two .r2 > .ell { flex: 0 1 auto; }
.row.done { opacity: 1; }
.tq .row.two .r1 { align-items: flex-start; }
.tq .row.two .r1 > .lbl, .tq .row.two .r1 > .m, .tq .row.two .r1 > .acted, .tq .row.two .r1 > .pg { padding-top: 2px; }
.tq .row.two .r1 > .t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.row .acted { font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); letter-spacing: var(--label-tracking); }

.st { font-family: var(--font-data); font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--label-tracking); white-space: nowrap; font-weight: var(--weight-medium); }
.st.run { color: var(--ink); }
.st.run2 { color: var(--ink-2); }
.st.idle { color: var(--faint); }
.st.ok { color: var(--muted); }
.st.paused { color: var(--muted); }
.st.fault { color: var(--fault); }
.st.stale { color: var(--muted); border: 1px dashed var(--rule-strong); padding: 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border: 1px solid var(--rule-strong); border-radius: var(--radius-control); font-family: var(--font-data); font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--label-tracking); color: var(--ink-2); white-space: nowrap; font-weight: var(--weight-medium); flex: none; }
.chip.ny { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.med { border-color: var(--accent); color: var(--accent); }
.chip.fault { border-color: var(--fault); color: var(--fault); }
.chip.low { color: var(--muted); }
.chip.plain { color: var(--muted); border-color: var(--rule); }
.pg { font-family: var(--font-data); font-size: 12px; width: 14px; text-align: center; flex: none; }
.pg.ny { color: var(--accent); }
.pg.fault { color: var(--fault); }
.pg.low { color: var(--muted); }
.tp { font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); border: 1px solid var(--rule); padding: 0 3px; flex: none; }
.sync { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); flex: none; }
.sync.ny { color: var(--accent); font-weight: var(--weight-strong); }

.dwrap { padding: 16px 20px 32px; max-width: 980px; }
.dmeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); }
.dtitle { font-size: var(--text-xl); font-weight: var(--weight-medium); margin: 8px 0 4px; line-height: 1.3; }
.sec { margin-top: 20px; }
.sec > .lbl { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.panel { background: var(--panel); border: var(--frame); }
.panel.pad { padding: 12px; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; align-items: baseline; }
.kv > .lbl { padding-top: 2px; }
.kv > .v { font-family: var(--font-data); font-size: var(--text-s); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.para { color: var(--ink); line-height: 1.55; }
.para p + p, .para p + ul, .para ul + p { margin-top: 8px; }
.ctx { color: var(--ink-2); font-size: var(--text-s); line-height: 1.5; margin-top: 6px; }
.term { margin: 0; background: var(--canvas); border: var(--frame); padding: 8px 10px; font: 12px/1.5 var(--font-data); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.term .bad { color: var(--fault); }
.ta, .inp { width: 100%; background: var(--canvas); border: 1px solid var(--rule-strong); border-radius: var(--radius-control); color: var(--ink); padding: 8px 10px; line-height: 1.5; caret-color: var(--ink); }
.ta { resize: vertical; min-height: 64px; }
.inp { height: 28px; padding: 0 8px; }
.ta:focus, .inp:focus { border-color: var(--ink-2); }
.ta::placeholder, .inp::placeholder { color: var(--faint); }
.jid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: var(--frame); }
.jid > div { background: var(--panel); padding: 8px 10px; }
.jid .v { font-size: var(--text-s); color: var(--ink); margin-top: 4px; line-height: 1.45; }
.opt { display: flex; gap: 10px; padding: 10px 12px; border: var(--frame); background: var(--panel); cursor: pointer; margin-bottom: 6px; align-items: flex-start; }
.opt.on { background: var(--selected); border-color: var(--ink-2); }
.opt .o-t { font-weight: var(--weight-medium); }
.opt .o-d { color: var(--ink-2); font-size: var(--text-s); margin-top: 2px; line-height: 1.45; }
.radio { font-family: var(--font-data); color: var(--muted); width: 14px; flex: none; }
.opt.on .radio { color: var(--ink); }
.gitem { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: var(--frame); font-size: var(--text-s); }
.gitem:last-child { border-bottom: 0; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; margin-top: 20px; border-top: var(--frame); }

.diff { margin: 0; background: var(--canvas); border: var(--frame); font: 12px/1.55 var(--font-data); color: var(--ink-2); overflow: auto; }
.diff > span { display: grid; grid-template-columns: 16px minmax(0, 1fr); padding: 0 10px 0 4px; }
.diff .dm { font-style: normal; text-align: center; color: var(--faint); user-select: none; }
.diff .dt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.diff .add { background: var(--diff-add); color: var(--ink); }
.diff .del { background: var(--diff-del); color: var(--ink-2); }
.diff .add .dm { color: var(--diff-add-mark); }
.diff .del .dm { color: var(--diff-del-mark); }
.diff .hunk { color: var(--muted); background: var(--panel); }
.diff .dh { color: var(--muted); }
.wdiff { line-height: 1.6; padding: 10px 12px; background: var(--canvas); border: var(--frame); }
.wd2 { background: var(--canvas); border: var(--frame); }
.wd2 .wl { display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 10px; padding: 8px 12px; line-height: 1.65; }
.wd2 .wl + .wl { border-top: var(--frame); }
.wd2 .wl > .lbl { padding-top: 3px; }
.wd2 ins { text-decoration: none; background: var(--diff-add); color: var(--ink); box-shadow: inset 0 -1px 0 var(--diff-add-mark); }
.wd2 del { background: var(--diff-del); color: var(--muted); text-decoration: line-through; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--text-s); color: var(--muted); margin-top: 6px; align-items: center; }
.legend > span { white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; }
.sw.add { background: var(--diff-add); box-shadow: inset 0 -1px 0 var(--diff-add-mark); }
.sw.del { background: var(--diff-del); }

.board { display: flex; gap: 8px; padding: 10px 12px; min-height: 100%; align-items: flex-start; }
.col { flex: 1 1 0; max-width: 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.col-h { overflow: hidden; white-space: nowrap; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 4px; }
.col-h .n { font-family: var(--font-data); font-size: var(--text-s); color: var(--muted); }
.col.shut { flex: 0 0 36px; min-width: 36px; max-width: 36px; border: var(--frame); background: var(--panel); align-items: center; padding: 8px 0; cursor: pointer; }
.body.bsplit { grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 380px); }
@media (max-width: 1439px) {
  .body.bsplit { grid-template-columns: minmax(0, 1fr) 272px; }
  .board { gap: 6px; padding: 10px 8px; }
}
.col.shut .vt { writing-mode: vertical-rl; font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); letter-spacing: var(--label-tracking); text-transform: uppercase; }
.card { min-width: 0; overflow: hidden; background: var(--panel); border: var(--frame); padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.card:hover { border-color: var(--rule-strong); }
.card.sel { background: var(--selected); border-color: var(--ink-2); }
.card .c1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; white-space: nowrap; }
.card .c1 > * { flex: none; }
.card .ct { font-size: var(--text-m); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .c2 { display: flex; align-items: center; gap: 2px 6px; font-size: var(--text-s); min-width: 0; flex-wrap: wrap; white-space: normal; }
.card .c2 .ext { color: var(--ink-2); font-family: var(--font-data); font-size: var(--text-micro); flex: 0 1 auto; min-width: 0; }
.card .c2 .arr { color: var(--muted); font-family: var(--font-data); font-size: var(--text-s); }
.card .c2 .xs { min-width: 0; }
.card .c2 { gap: 2px 4px; }
.card .c2 .st { letter-spacing: 0.02em; flex: none; }
.card .c2 .sync { flex: none; }
.card .c3 { font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; }
.card .csrc { display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--font-data); font-size: var(--text-s); color: var(--ink-2); }
.card .csrc .tp { color: var(--ink-2); border-color: var(--rule-strong); }
.vs { color: var(--faint); font-family: var(--font-data); font-size: var(--text-s); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-s); }
.tbl th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--panel); height: 28px; padding: 0 10px; border-bottom: var(--frame); white-space: nowrap; }
.tbl td { height: var(--row); padding: 2px 10px; border-bottom: 1px solid var(--panel); white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.tbl tr.r { cursor: pointer; }
.tbl tr.r:hover td { background: var(--panel); }

  });
}
render();
replay();
})();
</script>

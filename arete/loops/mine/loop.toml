kind = "watch"
description = "Review a closed parent spec and publish follow-up tickets for its repository or Arete"

[trigger]
event = ["spec.closed"]
group = "key"
trust = "internal"

[[source]]
name = "github-specs"
type = "closed-specs"
tracker = "github"
every = "5m"

[[source]]
name = "jira-specs"
type = "closed-specs"
tracker = "jira"
every = "5m"

[run]
tools = []
timeout_minutes = 15

[[emit]]
type = "ticket"
repo = "$finding.repo"
tracker = "configured"
labels = []
approve = false
